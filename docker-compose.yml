version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: advocatus-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: advocatus
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: advocatus-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
