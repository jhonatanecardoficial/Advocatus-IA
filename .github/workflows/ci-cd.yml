name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start local Supabase backend
      run: supabase start

    - name: Generate Prisma Client
      run: pnpm db:generate

    - name: Push Prisma Schema to database
      run: pnpm --filter @advocatus/api exec prisma db push
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    - name: Lint code
      run: pnpm lint

    - name: Build project
      run: pnpm build

    - name: Run unit tests
      run: pnpm test

    - name: Setup Playwright browsers
      run: pnpm exec playwright install --with-deps

    - name: Run Playwright tests
      run: pnpm exec playwright test
      env:
        CI: true

    - name: Upload Playwright test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Security audit
      run: pnpm audit --audit-level moderate
      continue-on-error: true

    - name: CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Generate security report
      run: |
        echo "## Security Scan Results" > security-report.md
        pnpm audit --json | jq -r '.vulnerabilities | to_entries[] | "- \(.key): \(.value.severity)"' >> security-report.md || echo "No vulnerabilities found" >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
        retention-days: 30