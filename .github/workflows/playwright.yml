name: Playwright API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start local Supabase backend
      run: supabase start

    - name: Generate Prisma Client
      run: pnpm db:generate

    - name: Push Prisma Schema to database
      run: pnpm --filter @advocatus/api exec prisma db push
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    - name: Create .env.test file
      run: |
        echo "API_PORT=4000" > .env.test
        echo "TEST_DB_URL=\"postgresql://postgres:postgres@127.0.0.1:54322/postgres\"" >> .env.test
        echo "TEST_JWT_SECRET=\"super-secret-jwt-token-with-at-least-32-characters-long\"" >> .env.test
        echo "DATABASE_URL=\"postgresql://postgres:postgres@127.0.0.1:54322/postgres\"" >> .env.test

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Run Playwright tests
      run: pnpm test
      env:
        CI: true

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
